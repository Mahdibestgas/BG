name: keep-awake
# Render's free web service sleeps after 15 idle minutes and then takes about a minute to wake.
# A light request every 10 minutes keeps it awake. GitHub may delay scheduled runs a little.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
permissions: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping the live site
        run: curl -fsS --retry 3 --retry-delay 20 --max-time 90 -o /dev/null -w "%{http_code} in %{time_total}s\n" https://bestgas-budgeting.onrender.com/api/auth/config
