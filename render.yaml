# Render Blueprint: one Docker web service (API + built web app). The database is a free Neon PostgreSQL
# (it does not expire): paste its direct connection string as DATABASE_URL in the Render Dashboard.
# The service migrates, applies row-level security and starts on every deploy (deploy/entrypoint.sh).
services:
  - type: web
    name: bestgas-budgeting
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/auth/config
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # Neon > project > Connect > direct connection (not pooled), owner role, ends in ?sslmode=require
      - key: DATABASE_URL
        sync: false
      - key: SESSION_KEY
        generateValue: true
      # Render's proxy is one hop in front of the app
      - key: CF13_TRUST_PROXY
        value: "1"
      # leave "on" only to create the first owner account, then set to "off" in the Dashboard
      - key: CF13_SIGNUP
        value: "on"
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_WEB_CONFIG
        sync: false

